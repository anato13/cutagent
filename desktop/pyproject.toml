[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anato12-studio"
version = "0.1.0"
description = "A local-first Windows video editor for Anato12"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
speech = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
anato12-studio = "anato12_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["anato12_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
